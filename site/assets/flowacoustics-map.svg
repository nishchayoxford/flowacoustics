<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1640" viewBox="0 0 1600 1640" role="img" aria-labelledby="title description">
<title id="title">FlowAcoustics: from cylinder flow to acoustic signatures</title>
<desc id="description">Editable computational workflow for the completed 459,264-cell, 10 second finite-cylinder demonstration. Saved full-volume fields are reconstructed. Curle internally integrates body loading; a separate forces export feeds the independent compact model. Closed-surface pressure feeds native FW-H. Native acoustic alternatives are compared, never summed. Numerical and scientific checks precede publication; execution is not physical validation.</desc>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.6"/></pattern>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4.5L0 9Z" fill="#94a3b8"/></marker>
  <marker id="independent-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4.5L0 9Z" fill="#fbbf24"/></marker>
  <style>
    .title {font:700 37px system-ui,sans-serif;fill:#f8fafc}
    .subtitle {font:19px system-ui,sans-serif;fill:#cbd5e1}
    .heading {font:700 24px system-ui,sans-serif;fill:#f8fafc}
    .body {font:19px system-ui,sans-serif;fill:#d5deea}
    .small {font:17px system-ui,sans-serif;fill:#a9b9ce}
    .eyebrow {font:700 14px system-ui,sans-serif;letter-spacing:1.5px;fill:#94a3b8}
    .base {fill:#0f172a;rx:12}
    .frame {fill:none;stroke-width:1.7;rx:12}
    .flowline {fill:none;stroke:#94a3b8;stroke-width:2.2;marker-end:url(#arrow)}
    .independent {fill:none;stroke:#fbbf24;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#independent-arrow)}
  </style>
</defs>
<rect width="1600" height="1640" fill="#020617"/>
<rect width="1600" height="1640" fill="url(#grid)"/>
<text x="60" y="65" class="title">From cylinder flow to acoustic signatures</text>
<text x="60" y="101" class="subtitle">FlowAcoustics · an executed-code demonstration with separate physical-accuracy checks</text>
<text id="run-status" x="60" y="136" class="small" style="fill:#34d399">10 s completed · 459,264 cells · saved 3D fields reconstructed · educational demonstration</text>

<!-- Edges appear before cards. data-from/data-to are the editable graph contract. -->
<g id="connections">
<path id="e-case-mesh" class="flowline" data-from="case" data-to="mesh" d="M490 254H552"/>
<path id="e-mesh-les" class="flowline" data-from="mesh" data-to="les" d="M1010 254H1072"/>
<path id="e-les-fields" class="flowline" data-from="les" data-to="fields" d="M1300 330V365H275V397"/>
<path id="e-les-forces" class="flowline" data-from="les" data-to="forces" d="M1300 330V365H790V397"/>
<path id="e-les-surface" class="flowline" data-from="les" data-to="surface" d="M1300 330V397"/>
<path id="e-fields-reconstruct" class="flowline" data-from="fields" data-to="reconstruct" d="M275 545V607"/>
<path id="e-forces-curle" class="flowline" data-from="forces" data-to="curle" d="M790 545V607"/>
<path id="e-surface-fwh" class="flowline" data-from="surface" data-to="fwh" d="M1300 545V607"/>
<path id="e-reconstruct-flow" class="flowline" data-from="reconstruct" data-to="flow" d="M275 755V817"/>
<path id="e-forces-compact" class="independent" data-from="forces" data-to="compact" d="M1010 472H1045V885H1018"/>
<path id="e-curle-receivers" class="flowline" data-from="curle" data-to="receivers" d="M790 755V785H1210V817"/>
<path id="e-fwh-receivers" class="flowline" data-from="fwh" data-to="receivers" d="M1390 755V817"/>
<path id="e-flow-analysis" class="flowline" data-from="flow" data-to="analysis" d="M275 995V1067"/>
<path id="e-compact-analysis" class="independent" data-from="compact" data-to="analysis" d="M790 995V1067"/>
<path id="e-receivers-analysis" class="flowline" data-from="receivers" data-to="analysis" d="M1300 995V1067"/>
<path id="e-analysis-release" class="flowline" data-from="analysis" data-to="release" d="M790 1250V1317"/>
</g>

<g id="case" data-node="true" data-x="60" data-y="180" data-width="430" data-height="150">
<rect class="base" x="60" y="180" width="430" height="150"/><rect class="frame" x="60" y="180" width="430" height="150" stroke="#94a3b8"/>
<text x="82" y="211" class="eyebrow">01 / DEFINE THE PHYSICAL CASE</text>
<text x="82" y="247" class="heading">Finite, fixed cylinder in water</text>
<text x="82" y="278" class="body">D = 0.02 m · L = 0.06 m · U = 0.2 m/s</text>
<text x="82" y="306" class="small">Closed end caps · circular outer domain</text>
</g>
<g id="mesh" data-node="true" data-x="560" data-y="180" data-width="450" data-height="150">
<rect class="base" x="560" y="180" width="450" height="150"/><rect class="frame" x="560" y="180" width="450" height="150" stroke="#34d399"/>
<text x="582" y="211" class="eyebrow">02 / REFINE, THEN CHECK</text>
<text x="582" y="247" class="heading">Native mesh &amp; geometry gates</text>
<text x="582" y="278" class="body">459,264 cells · below 500,000 ceiling</text>
<text x="582" y="306" class="small">Native checkMesh passed · closed caps</text>
</g>
<g id="les" data-node="true" data-x="1080" data-y="180" data-width="460" data-height="150">
<rect class="base" x="1080" y="180" width="460" height="150"/><rect class="frame" x="1080" y="180" width="460" height="150" stroke="#34d399"/>
<text x="1102" y="211" class="eyebrow">03 / EXECUTE THE FLOW</text>
<text x="1102" y="247" class="heading">3D WALE LES · pimpleFoam</text>
<text x="1102" y="278" class="body">10 s completed · eight MPI ranks</text>
<text x="1102" y="306" class="small">Fixed Δt = 0.000625 s · native logs retained</text>
</g>

<g id="fields" data-node="true" data-x="60" data-y="405" data-width="430" data-height="140">
<rect class="base" x="60" y="405" width="430" height="140"/><rect class="frame" x="60" y="405" width="430" height="140" stroke="#a78bfa"/>
<text x="82" y="438" class="eyebrow">FLOW BRANCH</text>
<text x="82" y="475" class="heading">Saved decomposed 3D fields</text>
<text x="82" y="506" class="body">U, p, turbulence fields · actual times</text>
<text x="82" y="532" class="small">Full-volume data, not sampled point clouds</text>
</g>
<g id="forces" data-node="true" data-x="560" data-y="405" data-width="450" data-height="140">
<rect class="base" x="560" y="405" width="450" height="140"/><rect class="frame" x="560" y="405" width="450" height="140" stroke="#a78bfa"/>
<text x="582" y="438" class="eyebrow">INTEGRATED LOADING BRANCH</text>
<text x="582" y="475" class="heading">Integrated body loading</text>
<text x="582" y="506" class="body">Pressure + viscous force on body [N]</text>
<text x="582" y="532" class="small">Curle recomputes; forces export is separate</text>
</g>
<g id="surface" data-node="true" data-x="1080" data-y="405" data-width="460" data-height="140">
<rect class="base" x="1080" y="405" width="460" height="140"/><rect class="frame" x="1080" y="405" width="460" height="140" stroke="#a78bfa"/>
<text x="1102" y="438" class="eyebrow">DISTRIBUTED LOADING BRANCH</text>
<text x="1102" y="475" class="heading">Closed-surface pressure</text>
<text x="1102" y="506" class="body">Face position, area, normal &amp; pressure</text>
<text x="1102" y="532" class="small">Include caps · convert kinematic p once</text>
</g>

<g id="reconstruct" data-node="true" data-x="60" data-y="615" data-width="430" data-height="140">
<rect class="base" x="60" y="615" width="430" height="140"/><rect class="frame" x="60" y="615" width="430" height="140" stroke="#22d3ee"/>
<text x="82" y="648" class="eyebrow">REASSEMBLE RETAINED TIMES</text>
<text x="82" y="685" class="heading">reconstructPar → ParaView</text>
<text x="82" y="716" class="body">Reconstructed at 2, 4, 6, 8 and 10 s</text>
<text x="82" y="742" class="small">Keep original processor directories</text>
</g>
<g id="curle" data-node="true" data-x="560" data-y="615" data-width="450" data-height="140">
<rect class="base" x="560" y="615" width="450" height="140"/><rect class="frame" x="560" y="615" width="450" height="140" stroke="#34d399"/>
<text x="582" y="648" class="eyebrow">NATIVE libAcoustics</text>
<text x="582" y="685" class="heading">Curle: compact loading</text>
<text x="582" y="716" class="body">Total body force · native source clock</text>
<text x="582" y="742" class="small">Retain native signs and near-field term</text>
</g>
<g id="fwh" data-node="true" data-x="1080" data-y="615" data-width="460" data-height="140">
<rect class="base" x="1080" y="615" width="460" height="140"/><rect class="frame" x="1080" y="615" width="460" height="140" stroke="#34d399"/>
<text x="1102" y="648" class="eyebrow">NATIVE libAcoustics</text>
<text x="1102" y="685" class="heading">FW-H: Farassat 1A</text>
<text x="1102" y="716" class="body">Pressure loading · facewise retardation</text>
<text x="1102" y="742" class="small">Zero thickness · no volume quadrupoles</text>
</g>

<g id="flow" data-node="true" data-x="60" data-y="825" data-width="430" data-height="170">
<rect class="base" x="60" y="825" width="430" height="170"/><rect class="frame" x="60" y="825" width="430" height="170" stroke="#22d3ee"/>
<text x="82" y="858" class="eyebrow">SEE THE SOURCE PHYSICS</text>
<text x="82" y="895" class="heading">Circular flow &amp; wall diagnostics</text>
<text x="82" y="927" class="body">Vorticity · velocity · wall resolution</text>
<text x="82" y="955" class="small">Equal physical scales · true plane masks</text>
<text x="82" y="982" class="small">CSV / VTP / PVD for sampled exports</text>
</g>
<g id="compact" data-node="true" data-x="560" data-y="825" data-width="450" data-height="170">
<rect class="base" x="560" y="825" width="450" height="170"/><rect class="frame" x="560" y="825" width="450" height="170" stroke="#fbbf24"/>
<text x="582" y="858" class="eyebrow">INDEPENDENT PYTHON MODEL</text>
<text x="582" y="895" class="heading">Retarded compact-force check</text>
<text x="582" y="927" class="body">Use force on fluid = −force on body</text>
<text x="582" y="955" class="small">Separate 1/r² reactive and 1/r radiation</text>
<text x="582" y="982" class="small">No fitted gain, sign or propagation delay</text>
</g>
<g id="receivers" data-node="true" data-x="1080" data-y="825" data-width="460" data-height="170">
<rect class="base" x="1080" y="825" width="460" height="170"/><rect class="frame" x="1080" y="825" width="460" height="170" stroke="#a78bfa"/>
<text x="1102" y="858" class="eyebrow">ALTERNATIVE PREDICTIONS, NOT A SUM</text>
<text x="1102" y="895" class="heading">Native observer pressure [Pa]</text>
<text x="1102" y="927" class="body">Five positions · Curle and FW-H</text>
<text x="1102" y="955" class="small">Preserve clocks · compare, not summed</text>
<text x="1102" y="982" class="small">1–2 m receivers can be acoustically near</text>
</g>

<g id="analysis" data-node="true" data-x="60" data-y="1075" data-width="1480" data-height="175">
<rect class="base" x="60" y="1075" width="1480" height="175"/><rect class="frame" x="60" y="1075" width="1480" height="175" stroke="#22d3ee"/>
<text x="82" y="1108" class="eyebrow">04 / TURN RECORDS INTO INTERPRETABLE SIGNATURES</text>
<text x="82" y="1145" class="heading">Traceable signal processing, with sampling and propagation limits</text>
<text x="82" y="1178" class="body">Loading &amp; Strouhal · PSD [Pa²/Hz] · time-frequency maps · band levels [dB re 1 µPa] · coherence &amp; phase</text>
<text x="82" y="1208" class="body">Whole-record block trends + declared late-window sensitivity · no invented tails or unsupported bandwidth</text>
<text x="82" y="1235" class="small">Independent analytical lessons remain labelled teaching examples; dense compact-model sweeps are not native FW-H data.</text>
</g>
<g id="release" data-node="true" data-x="60" data-y="1325" data-width="1480" data-height="175">
<rect class="base" x="60" y="1325" width="1480" height="175"/><rect class="frame" x="60" y="1325" width="1480" height="175" stroke="#fb7185"/>
<text x="82" y="1358" class="eyebrow">05 / VERIFY, THEN PUBLISH</text>
<text x="82" y="1395" class="heading">One coherent mesh → run → data → figure → public-page identity</text>
<text x="82" y="1428" class="body">Native logs &amp; hashes · independent numerical checks · every-plot audit · desktop/mobile rendering · download readback</text>
<text x="82" y="1458" class="body">GitHub Pages receives checked compact artifacts, not private paths, the downloaded paper or bulky CFD volumes.</text>
<text x="82" y="1485" class="small">Execution and software verification are not experimental validation. A longer record does not prove mesh independence.</text>
</g>

<path d="M62 1544H105" class="flowline"/><text x="119" y="1551" class="small">Computational dependency</text>
<path d="M461 1544H505" class="independent"/><text x="519" y="1551" class="small">Independent check from the same recorded loads</text>
<text x="60" y="1596" class="small">Scope: curated project workflow · update authority: docs/cylinder_60s/PLAN.md and the executed run record</text>
</svg>
