[pytest]
# Safe default: pure numerical/parser tests plus absence-based archive checks.
# Native/coordinator/mesh-build tests are retained for audit, not default execution.
testpaths =
    tests/test_acoustics2d.py
    tests/test_mrl2d_postprocess.py
    tests/test_mrl2d_runtime.py
    tests/test_mrl2d_runtime_audit.py
    tests/test_mrl2d_runtime_resume.py
    tests/test_public_package.py
pythonpath = src
filterwarnings = error
addopts = -ra -p no:cacheprovider
