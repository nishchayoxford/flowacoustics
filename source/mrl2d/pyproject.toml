[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flowacoustics"
version = "0.1.0"
description = "Educational cylinder LES, Curle and FW-H acoustic demonstration"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "matplotlib>=3.8,<4",
  "pandas>=2.2,<3",

]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "websockets>=14,<18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
