name: Publish demonstration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the public project copy
        uses: actions/checkout@v4
      - name: Verify static entry points
        run: |
          test -s site/index.html
          test -s site/data/results.json
          python3 -m json.tool site/data/results.json > /dev/null
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site only
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
